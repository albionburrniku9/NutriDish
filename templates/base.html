<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriDish - AI Recipe Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="glass-nav">
        <div class="logo">NutriDish <span class="ai-badge">AI</span></div>
        <ul class="nav-links">
            <li><a href="#" class="active">{{ t['nav_home'] }}</a></li>
            <li><a href="#">{{ t['nav_lab'] }} <span class="soon-badge">{{ t['nav_soon'] }}</span></a></li>
            <li><a href="#">{{ t['nav_profile'] }}</a></li>
            <li class="lang-selector">
                <select id="language-select" onchange="window.location.href='/set_lang/'+this.value">
                    <option value="en" {% if lang=='en' %}selected{% endif %}>🇬🇧 EN</option>
                    <option value="sq" {% if lang=='sq' %}selected{% endif %}>🇦🇱 SQ</option>
                    <option value="de" {% if lang=='de' %}selected{% endif %}>🇩🇪 DE</option>
                </select>
            </li>
        </ul>
    </nav>

    <!-- Auto-Detect Language Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if user has already set a language preference via cookie
            const userLang = getCookie('lang');

            // Safety: Check if we just ran auto-detect to prevent loops
            const autoDetectDone = sessionStorage.getItem('autoDetectRun');

            if (!userLang && !autoDetectDone) {
                // Mark as run so we don't loop
                sessionStorage.setItem('autoDetectRun', 'true');

                // If no cookie, try to detect location
                fetch('https://ipapi.co/json/')
                    .then(response => response.json())
                    .then(data => {
                        const country = data.country_code;
                        let targetLang = 'en';

                        // Logic: Balkans -> SQ
                        const balkanCountries = ['AL', 'XK', 'RS', 'MK', 'ME'];
                        // Logic: DACH -> DE
                        const dachCountries = ['DE', 'CH', 'AT'];

                        if (balkanCountries.includes(country)) {
                            targetLang = 'sq';
                        } else if (dachCountries.includes(country)) {
                            targetLang = 'de';
                        }

                        // If detected language is different from default 'en', switch
                        if (targetLang !== 'en') {
                            window.location.href = `/set_lang/${targetLang}`;
                        } else {
                            // If EN is detected, set cookie client-side to stop checks
                            document.cookie = "lang=en; path=/; max-age=2592000";
                        }
                    })
                    .catch(err => console.log('Geo-detection failed:', err));
            }
        });

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
    </script>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}?v=2"></script>
</body>

</html>
