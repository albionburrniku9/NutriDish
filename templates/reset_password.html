{% extends 'base.html' %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        width: 100%;
        padding: 20px;
    }

    .auth-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 2rem;
        color: white;
        text-align: center;
        font-family: var(--font-heading);
    }

    .auth-card {
        background-color: #18181b;
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    .auth-input {
        width: 100%;
        background: transparent;
        border: 1px solid #3f3f46;
        border-radius: 30px;
        padding: 14px 20px;
        color: white;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .auth-input:focus {
        border-color: #8FA98B;
        box-shadow: 0 0 0 2px rgba(143, 169, 139, 0.18);
    }

    .btn-primary {
        width: 100%;
        background: #8FA98B;
        color: white;
        border: none;
        border-radius: 30px;
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 15px rgba(143, 169, 139, 0.25);
    }

    .btn-primary:hover {
        background: #A8B89F;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(143, 169, 139, 0.38);
    }
</style>

<div class="auth-wrapper">
    <h1 class="auth-title">{{ t['auth_reset_title'] }}</h1>

    <div class="auth-card">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 20px; font-size: 0.95rem; font-weight: 500;">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <input type="password" name="password" class="auth-input" placeholder="{{ t['profile_new_pass'] }}" required>
            </div>
            <div class="form-group">
                <input type="password" name="confirm_password" class="auth-input" placeholder="{{ t['profile_confirm_pass'] }}" required>
            </div>
            <button type="submit" class="btn-primary">{{ t['auth_reset_save_btn'] }}</button>
        </form>
    </div>
</div>
{% endblock %}
